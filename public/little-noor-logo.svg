<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" fill="none">
  <!-- Little Noor Montessori School Official Emblem -->
  
  <!-- Outer Circular Wreath Vine -->
  <circle cx="250" cy="250" r="186" stroke="#9EA872" stroke-width="2.5" stroke-dasharray="8 3" opacity="0.65" />
  <circle cx="250" cy="250" r="184" stroke="#8E9963" stroke-width="2" />
  
